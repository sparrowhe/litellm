name: Build Docker Image and Push to Harbor

on:
  push:
  workflow_dispatch:


jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/litellm:latest .

      - name: Login to Harbor
        run: |
          echo '${{ secrets.HARBOR_PASSWORD }}' | docker login ${{ secrets.HARBOR_URL }} \
            -u '${{ secrets.HARBOR_USERNAME }}' \
            --password-stdin

      - name: Push Docker Image to Harbor
        run: |
          docker push ${{ secrets.HARBOR_URL }}/${{ secrets.HARBOR_PROJECT }}/litellm:latest